<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hermes Runner Console</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <aside class="runner-panel">
        <header>
          <p class="eyebrow">Runner</p>
          <h1>Hermes Console</h1>
        </header>
        <form id="run-form" class="control-form">
          <label>
            Topic
            <textarea id="topic" rows="8" required></textarea>
          </label>
          <div class="form-row">
            <label>
              Max rounds
              <input id="maxRounds" type="number" min="1" value="2">
            </label>
            <label class="toggle-row">
              <input id="enableExecution" type="checkbox" checked>
              Execute actions
            </label>
          </div>
          <div class="endpoint-field">
            <label for="plannerUrl">Planner URL</label>
            <div class="endpoint-row">
              <input id="plannerUrl" type="url" required>
              <button id="checkPlannerButton" type="button" class="icon-button" title="Check Planner URL">Check</button>
              <span id="plannerHealth" class="health-status idle" aria-live="polite">-</span>
            </div>
          </div>
          <div class="endpoint-field">
            <label for="builderUrl">Builder URL</label>
            <div class="endpoint-row">
              <input id="builderUrl" type="url" required>
              <button id="checkBuilderButton" type="button" class="icon-button" title="Check Builder URL">Check</button>
              <span id="builderHealth" class="health-status idle" aria-live="polite">-</span>
            </div>
          </div>
          <button id="runButton" type="submit">Run Session</button>
          <button id="resetButton" type="button" class="secondary">Reset Defaults</button>
        </form>
        <section>
          <div class="sessions-heading">
            <h2>Sessions</h2>
            <span>Asia/Taipei (UTC+08:00)</span>
          </div>
          <div id="session-list" class="session-list"></div>
        </section>
      </aside>
      <section class="main-panel">
        <div id="status-banner" class="status-banner">Ready</div>
        <section class="live-strip">
          <div>
            <span>Live status</span>
            <strong id="liveStatus">idle</strong>
          </div>
          <div>
            <span>Active speaker</span>
            <strong id="activeSpeaker">none</strong>
          </div>
          <div>
            <span>Live events</span>
            <strong id="liveEventCount">0</strong>
          </div>
        </section>
        <section id="summary" class="summary-grid"></section>
        <section class="content-grid">
          <div class="activity-panel">
            <div class="view-tabs" role="tablist" aria-label="Session views">
              <button id="timelineTab" type="button" class="view-tab selected" aria-controls="timelinePanel">Timeline</button>
              <button id="workbenchTab" type="button" class="view-tab" aria-controls="workbenchPanel">Workbench</button>
            </div>
            <div id="timelinePanel" class="timeline-panel">
              <div class="section-heading">
                <h2>Meeting Timeline</h2>
                <div class="timeline-toolbar" aria-label="Timeline controls">
                  <button id="collapseAllButton" type="button" class="secondary compact">Collapse all</button>
                  <button id="expandAllButton" type="button" class="secondary compact">Expand all</button>
                  <button id="latestButton" type="button" class="secondary compact">Latest</button>
                </div>
              </div>
              <div id="timeline" class="timeline timeline-scroll"></div>
            </div>
            <div id="workbenchPanel" class="workbench-panel hidden-view">
              <div class="section-heading">
                <h2>Agent Visual Workbench</h2>
              </div>
              <div id="workbench" class="workbench-grid"></div>
            </div>
          </div>
          <aside class="execution-panel">
            <h2>Execution</h2>
            <div id="execution"></div>
            <h2>Workspace Files</h2>
            <div id="workspace-files"></div>
          </aside>
        </section>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
